<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>星光圣诞树 · 定制你的专属圣诞祝福</title>
  <meta name="description" content="一棵可定制祝福文字的 3D 发光粒子圣诞树，编辑专属祝福并生成链接一键分享。" />
  <style>
    :root {
      --bg-top: #040910;
      --bg-mid: #08131d;
      --bg-bot: #0c1c28;
      --accent: #f3d285;
      --accent-soft: rgba(243, 210, 133, 0.16);
      --accent-strong: #ffe7ad;
      --glass-bg: rgba(8, 15, 24, 0.62);
      --glass-bg-hover: rgba(14, 24, 38, 0.78);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-strong: rgba(255, 255, 255, 0.22);
      --text-primary: rgba(255, 252, 245, 0.96);
      --text-secondary: rgba(235, 232, 224, 0.72);
      --text-muted: rgba(220, 218, 210, 0.48);
      --font-serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", Georgia, "Times New Roman", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-panel: 0 24px 64px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 35%, var(--bg-bot) 0%, var(--bg-mid) 48%, var(--bg-top) 100%);
      color: var(--text-primary);
      font-family: var(--font-sans);
      transition: background 0.9s ease;
      user-select: none;
    }

    /* Fullscreen 3D Canvas */
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #scene:active {
      cursor: grabbing;
    }

    /* Subtle atmospheric vignette */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.52) 100%);
      z-index: 1;
    }

    /* Top Header & Controls */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px 24px;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .brand-title {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-title h1 {
      font-family: var(--font-serif);
      font-size: clamp(20px, 2.8vw, 30px);
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--accent-strong);
      text-shadow: 0 2px 24px rgba(243, 210, 133, 0.35);
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .top-actions {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease, color 0.25s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    .icon-btn:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-strong);
      transform: translateY(-1px);
    }

    .icon-btn:active {
      transform: translateY(0);
    }

    .icon-btn.square {
      width: 40px;
      padding: 0;
      justify-content: center;
    }

    .icon-btn.active {
      border-color: rgba(243, 210, 133, 0.5);
      color: var(--accent-strong);
      background: rgba(243, 210, 133, 0.12);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .btn-label {
      white-space: nowrap;
    }

    /* Blessing Display Card */
    .blessing-stage {
      position: fixed;
      left: 28px;
      bottom: 28px;
      z-index: 15;
      max-width: min(440px, calc(100vw - 56px));
      pointer-events: auto;
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.editor-open .blessing-stage {
      left: 28px;
    }

    .blessing-card {
      position: relative;
      padding: 24px 28px;
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(12, 20, 32, 0.64), rgba(6, 11, 18, 0.48));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-panel);
      animation: cardFloatIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardFloatIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .blessing-to {
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .blessing-to::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(243, 210, 133, 0.35), transparent);
    }

    .blessing-message {
      font-family: var(--font-serif);
      font-size: clamp(15px, 1.8vw, 18px);
      line-height: 1.9;
      letter-spacing: 0.05em;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }

    .blessing-from {
      margin-top: 16px;
      text-align: right;
      font-family: var(--font-serif);
      font-size: 14px;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
    }

    /* Subtle interaction hint */
    .canvas-hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      pointer-events: none;
      opacity: 0.78;
      transition: opacity 0.6s ease;
      white-space: nowrap;
    }

    /* Editor Drawer (Desktop Right Side, Mobile Bottom Sheet) */
    .editor-drawer {
      position: fixed;
      top: 76px;
      right: 24px;
      bottom: 24px;
      width: 372px;
      max-width: calc(100vw - 32px);
      z-index: 30;
      border-radius: var(--radius-lg);
      background: rgba(9, 15, 24, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateX(0);
      opacity: 1;
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.32s ease;
    }

    .editor-drawer.collapsed {
      transform: translateX(calc(100% + 40px));
      opacity: 0;
      pointer-events: none;
    }

    .editor-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .editor-header h2 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-primary);
    }

    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: var(--text-primary);
    }

    .editor-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    .char-count {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .text-input, .text-area {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
      user-select: text;
    }

    .text-input::placeholder, .text-area::placeholder {
      color: var(--text-muted);
    }

    .text-input:focus, .text-area:focus {
      border-color: rgba(243, 210, 133, 0.55);
      background: rgba(255, 255, 255, 0.08);
    }

    .text-area {
      resize: vertical;
      min-height: 92px;
      max-height: 180px;
    }

    /* Quick Greeting Presets */
    .preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip-btn {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn:hover {
      border-color: rgba(243, 210, 133, 0.45);
      color: var(--accent-strong);
      background: rgba(243, 210, 133, 0.1);
    }

    /* Theme Swatches */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .theme-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.035);
      color: var(--text-secondary);
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.22s ease;
      text-align: left;
    }

    .theme-option:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .theme-option.active {
      border-color: rgba(243, 210, 133, 0.65);
      background: rgba(243, 210, 133, 0.12);
      color: var(--text-primary);
    }

    .swatch-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.4), 0 0 10px rgba(0, 0, 0, 0.35);
    }

    /* Editor Footer & Share Actions */
    .editor-footer {
      padding: 14px 20px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
      background: rgba(4, 8, 14, 0.35);
    }

    .primary-btn {
      width: 100%;
      height: 44px;
      border-radius: var(--radius-md);
      border: none;
      background: linear-gradient(135deg, #f3d285 0%, #d8a74a 100%);
      color: #161006;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(216, 167, 74, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .primary-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(216, 167, 74, 0.38);
    }

    .primary-btn:active {
      transform: translateY(0);
    }

    .secondary-btn {
      width: 100%;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    /* Share Link Output Box */
    .share-result {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(243, 210, 133, 0.28);
    }

    .share-result.visible {
      display: flex;
    }

    .share-url-input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--accent-strong);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      outline: none;
      user-select: all;
    }

    .share-note {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Intro Reveal State */
    .blessing-stage.intro-hidden {
      opacity: 0;
      transform: translateY(24px);
      pointer-events: none;
    }

    /* Pure View (Hide UI) */
    body.pure-view .top-bar,
    body.pure-view .blessing-stage,
    body.pure-view .editor-drawer,
    body.pure-view .canvas-hint {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(10px);
    }

    .exit-pure-btn {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    body.pure-view .exit-pure-btn {
      opacity: 0.72;
      pointer-events: auto;
    }

    body.pure-view .exit-pure-btn:hover {
      opacity: 1;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translate(-50%, -20px);
      z-index: 60;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(15, 24, 38, 0.92);
      border: 1px solid rgba(243, 210, 133, 0.4);
      color: var(--accent-strong);
      font-size: 13px;
      letter-spacing: 0.03em;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Responsive Mobile Layout */
    @media (max-width: 768px) {
      .top-bar {
        padding: 14px 16px;
      }

      .icon-btn .btn-label {
        display: none;
      }

      .icon-btn.keep-label .btn-label {
        display: inline;
      }

      .blessing-stage {
        left: 16px;
        right: 16px;
        bottom: 34px;
        max-width: none;
      }

      .blessing-card {
        padding: 18px 20px;
      }

      .editor-drawer {
        top: auto;
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
        max-width: none;
        max-height: 76vh;
      }

      .editor-drawer.collapsed {
        transform: translateY(calc(100% + 28px));
      }

      .canvas-hint {
        bottom: 10px;
        font-size: 10.5px;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="3D 发光粒子圣诞树互动场景"></canvas>
  <div class="vignette"></div>

  <header class="top-bar">
    <div class="brand-title">
      <h1 id="display-title">Merry Christmas</h1>
      <span class="brand-subtitle" id="mode-badge">WINTER STARLIGHT EDITION</span>
    </div>

    <div class="top-actions">
      <button id="music-btn" class="icon-btn" type="button" title="播放/暂停八音盒音乐" aria-label="播放或暂停音乐">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span class="btn-label" id="music-label">八音盒</span>
      </button>

      <button id="pure-btn" class="icon-btn square" type="button" title="纯净观赏模式（隐藏文字与按钮）" aria-label="纯净观赏模式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>

      <button id="toggle-editor-btn" class="icon-btn keep-label" type="button" title="编辑祝福文字" aria-label="编辑祝福">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        <span class="btn-label" id="toggle-editor-label">编辑祝福</span>
      </button>
    </div>
  </header>

  <button id="exit-pure-btn" class="icon-btn exit-pure-btn" type="button">
    <span>显示界面</span>
  </button>

  <main class="blessing-stage" id="blessing-stage">
    <article class="blessing-card">
      <div class="blessing-to" id="display-to">TO · 亲爱的你</div>
      <div class="blessing-message" id="display-message">愿这个冬天的每一片雪花，
都带着温柔与星光落向你。
岁末常欢愉，新年皆胜意。</div>
      <div class="blessing-from" id="display-from">—— 送给你的圣诞星光</div>
    </article>
  </main>

  <div class="canvas-hint" id="canvas-hint">拖拽旋转 · 双击或极限放大化作星海 · 点击树顶唤流星雨 · 点击夜空许愿</div>

  <aside class="editor-drawer" id="editor-drawer" aria-label="祝福内容编辑器">
    <div class="editor-header">
      <h2>定制你的圣诞祝福</h2>
      <button id="close-editor-btn" class="close-btn" type="button" aria-label="收起编辑器">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="editor-body">
      <div class="field-group">
        <label class="field-label" for="input-title">顶部标题</label>
        <input id="input-title" class="text-input" type="text" maxlength="36" placeholder="Merry Christmas" />
      </div>

      <div class="field-row">
        <div class="field-group">
          <label class="field-label" for="input-to">收件人 (To)</label>
          <input id="input-to" class="text-input" type="text" maxlength="24" placeholder="亲爱的你" />
        </div>
        <div class="field-group">
          <label class="field-label" for="input-from">落款 (From)</label>
          <input id="input-from" class="text-input" type="text" maxlength="24" placeholder="你的名字" />
        </div>
      </div>

      <div class="field-group">
        <div class="field-label-row">
          <label class="field-label" for="input-message">祝福正文</label>
          <span class="char-count" id="char-count">0 / 240</span>
        </div>
        <textarea id="input-message" class="text-area" maxlength="240" placeholder="写下你想对 TA 说的话..."></textarea>
        <div class="preset-chips" id="preset-chips">
          <button type="button" class="chip-btn" data-preset="warm">温柔浪漫</button>
          <button type="button" class="chip-btn" data-preset="friend">挚友轻松</button>
          <button type="button" class="chip-btn" data-preset="geek">代码浪漫</button>
          <button type="button" class="chip-btn" data-preset="minimal">简短高级</button>
        </div>
      </div>

      <div class="field-group">
        <span class="field-label">视觉主题</span>
        <div class="theme-grid" id="theme-grid">
          <button type="button" class="theme-option active" data-theme="0">

      const PRESETS = {

      const DEFAULT_STATE = {
        title: PRESETS.warm.title,
